<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mizan — ميزان</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1a1a18; --muted: #6b6b66;
    --line: #e4e4df; --accent: #2f6f5f; --danger: #a8352c; --warn: #9a6b1f;
    --code-bg: #f5f5f2;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --ink: #e8e8e4; --muted: #9a9a93;
      --line: #33343a; --accent: #6bbfa3; --danger: #e0796f; --warn: #d6a94e;
      --code-bg: #141517;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 1.75rem; }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; letter-spacing: -.01em; }
  h1 span { color: var(--accent); font-weight: 500; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input[type=text] {
    flex: 1; padding: .7rem .85rem; font-size: 1rem; font-family: inherit;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: .7rem 1.2rem; font-size: 1rem; font-family: inherit; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
  }
  button:disabled { opacity: .55; cursor: progress; }
  .examples { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.5rem; }
  .examples button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    padding: .3rem .65rem; font-size: .82rem; border-radius: 999px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 1rem 1.15rem; margin-bottom: .9rem;
  }
  .card h2 {
    margin: 0 0 .6rem; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); font-weight: 600;
  }
  pre {
    margin: 0; padding: .8rem; background: var(--code-bg); border-radius: 6px;
    font-family: var(--mono); font-size: .86rem; overflow-x: auto; white-space: pre-wrap;
  }
  .rtl { direction: rtl; text-align: right; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .scroll { overflow-x: auto; }
  th, td { padding: .45rem .6rem; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; }
  .badge {
    display: inline-block; padding: .18rem .55rem; border-radius: 999px;
    font-size: .76rem; font-weight: 600;
  }
  .high { background: #2f6f5f22; color: var(--accent); }
  .medium { background: #9a6b1f22; color: var(--warn); }
  .low { background: #a8352c22; color: var(--danger); }
  .violation { color: var(--danger); font-family: var(--mono); font-size: .85rem; }
  .note { color: var(--warn); font-size: .85rem; }
  .meta { color: var(--muted); font-size: .8rem; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: .5rem; }
  .bar > div { height: 100%; background: var(--accent); }
  .hidden { display: none; }
  /* The mock provider returns canned SQL from a fixture table. Without a visible marker
     its output is indistinguishable from a real model's, which is genuinely misleading —
     it is the exact confusion that prompted adding this. */
  .banner {
    margin-top: .9rem; padding: .6rem .8rem; border-radius: 8px; font-size: .85rem;
    border: 1px solid var(--warn); color: var(--warn); background: #9a6b1f14;
  }
  .banner.live { border-color: var(--accent); color: var(--accent); background: #2f6f5f14; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mizan <span>ميزان</span></h1>
    <p class="sub">Bilingual Arabic/English Text-to-SQL. Every query is validated against the
      real schema before it is allowed to run.</p>
    <div id="banner" class="banner hidden"></div>
  </header>

  <form id="form">
    <input id="q" type="text" placeholder="Ask in English or Arabic…" autocomplete="off" autofocus>
    <button id="go" type="submit">Ask</button>
  </form>

  <div class="examples" id="examples"></div>

  <div id="out"></div>
</div>

<script>
const EXAMPLES = [
  "how many orders were delivered late?",
  "which courier delivered late most often?",
  "كم عدد الطلبات المتأخرة في دبي؟",
  "ما متوسط قيمة الطلب لكل مدينة؟",
  "drop the orders table",
];

const out = document.getElementById("out");
const qEl = document.getElementById("q");
const goEl = document.getElementById("go");

// Announce which backend is serving. On the mock provider the SQL comes from a fixture
// table, not from a model, and saying so up front is the difference between a demo and a
// magic trick.
fetch("/api/health").then(r => r.json()).then(h => {
  const b = document.getElementById("banner");
  b.classList.remove("hidden");
  if (h.provider === "mock") {
    b.textContent = "Mock backend — SQL comes from a fixture table, not a model. "
      + "The guardrails, schema validation and execution are real. "
      + "Run with MIZAN_PROVIDER=ollama for genuine generation.";
  } else {
    b.classList.add("live");
    b.textContent = `Live backend: ${h.provider}/${h.model}. Generation may take ~90s on CPU.`;
  }
}).catch(() => {});

const examplesEl = document.getElementById("examples");
for (const ex of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = ex;
  b.onclick = () => { qEl.value = ex; document.getElementById("form").requestSubmit(); };
  examplesEl.appendChild(b);
}

const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const question = qEl.value.trim();
  if (!question) return;

  goEl.disabled = true;

  // A static "Generating…" is indistinguishable from a hang, and on CPU inference this
  // legitimately takes ~90s — longer if another process (an eval run) is queued at the
  // same model, because Ollama serialises requests per model. Showing elapsed time is the
  // difference between "working" and "broken" from the user's side.
  const started = Date.now();
  let tick = null;
  const paint = () => {
    const s = Math.round((Date.now() - started) / 1000);
    let note = "";
    if (s > 150) {
      note = "<br>Much slower than usual — another process may be queued at the same "
           + "model. Check with: <code>pgrep -fa 'mizan eval'</code>";
    } else if (s > 20) {
      note = "<br>CPU inference takes ~90s for a 7B model. This is normal.";
    }
    out.innerHTML = `<div class="card meta">Generating… <strong>${s}s</strong>${note}</div>`;
  };
  paint();
  tick = setInterval(paint, 1000);

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    if (!res.ok) {
      const detail = await res.text();
      out.innerHTML = `<div class="card"><h2>Service error</h2>
        <div class="violation">HTTP ${res.status}</div><pre>${esc(detail)}</pre></div>`;
      return;
    }
    render(await res.json());
  } catch (err) {
    out.innerHTML = `<div class="card"><h2>Network error</h2>
      <div class="violation">${esc(err.message)}</div></div>`;
  } finally {
    if (tick) clearInterval(tick);
    goEl.disabled = false;
  }
};

function render(d) {
  let html = "";

  html += `<div class="card"><h2>Question · ${esc(d.script)}</h2>
    <div${d.rtl ? ' class="rtl"' : ""}>${esc(d.question)}</div></div>`;

  if (d.sql) {
    html += `<div class="card"><h2>Generated SQL</h2><pre>${esc(d.sql)}</pre></div>`;
  }

  if (d.violations && d.violations.length) {
    html += `<div class="card"><h2>Blocked by guardrails</h2>`;
    for (const v of d.violations) {
      html += `<div class="violation">${esc(v.rule)} — ${esc(v.detail)}</div>`;
    }
    html += `<p class="meta" style="margin-bottom:0">The query was rejected before touching
      the database. Nothing was executed.</p></div>`;
  }

  if (d.warnings && d.warnings.length) {
    html += `<div class="card"><h2>Notes</h2>`;
    for (const w of d.warnings) html += `<div class="note">${esc(w)}</div>`;
    html += `</div>`;
  }

  if (d.result) {
    const cols = d.result.columns, rows = d.result.rows;
    html += `<div class="card"><h2>Result · ${rows.length} rows</h2><div class="scroll"><table><thead><tr>`;
    for (const c of cols) html += `<th>${esc(c)}</th>`;
    html += `</tr></thead><tbody>`;
    for (const r of rows.slice(0, 50)) {
      html += "<tr>" + r.map(v => `<td>${esc(v === null ? "∅" : v)}</td>`).join("") + "</tr>";
    }
    html += `</tbody></table></div>`;
    if (d.result.truncated) html += `<p class="note" style="margin-bottom:0">Truncated.</p>`;
    html += `</div>`;
  }

  if (d.error && !(d.violations || []).length) {
    html += `<div class="card"><h2>Error</h2><div class="violation">${esc(d.error)}</div></div>`;
  }

  const c = d.confidence || {};
  // `band` is interpolated into a class attribute, not into text, so esc() is the wrong
  // tool — attribute context needs an allowlist, not entity encoding. The value is
  // server-controlled today; pinning it to the three known bands means a future change
  // that makes it data-derived cannot turn into attribute injection.
  const BANDS = ["high", "medium", "low"];
  const band = BANDS.includes(c.band) ? c.band : "low";
  const pct = Math.round((c.score || 0) * 100);
  html += `<div class="card"><h2>Confidence</h2>
    <span class="badge ${band}">${pct}% · ${esc(band)}</span>
    <div class="bar"><div style="width:${pct}%"></div></div>`;
  for (const s of (c.signals || [])) {
    html += `<div class="meta" style="margin-top:.4rem">
      <strong>${esc(s.name)}</strong> ${Math.round(s.value * 100)}% — ${esc(s.detail)}</div>`;
  }
  html += `<p class="meta" style="margin:.7rem 0 0">A heuristic ranking signal, not a
    calibrated probability.</p></div>`;

  html += `<p class="meta">${esc(d.provider)}/${esc(d.model)} · ${d.latency_ms} ms</p>`;
  out.innerHTML = html;
}
</script>
</body>
</html>
