<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text-to-SQL Guardrails</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1a1a18; --muted: #6b6b66;
    --line: #e4e4df; --accent: #2f6f5f; --danger: #a8352c; --warn: #9a6b1f;
    --code-bg: #f5f5f2;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --ink: #e8e8e4; --muted: #9a9a93;
      --line: #33343a; --accent: #6bbfa3; --danger: #e0796f; --warn: #d6a94e;
      --code-bg: #141517;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 1.75rem; }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; letter-spacing: -.01em; }
  h1 span { color: var(--accent); font-weight: 500; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input[type=text] {
    flex: 1; padding: .7rem .85rem; font-size: 1rem; font-family: inherit;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: .7rem 1.2rem; font-size: 1rem; font-family: inherit; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
  }
  button:disabled { opacity: .55; cursor: progress; }
  .examples { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.5rem; }
  .examples button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    padding: .3rem .65rem; font-size: .82rem; border-radius: 999px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 1rem 1.15rem; margin-bottom: .9rem;
  }
  .card h2 {
    margin: 0 0 .6rem; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); font-weight: 600;
  }
  pre {
    margin: 0; padding: .8rem; background: var(--code-bg); border-radius: 6px;
    font-family: var(--mono); font-size: .86rem; overflow-x: auto; white-space: pre-wrap;
  }
  .rtl { direction: rtl; text-align: right; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .scroll { overflow-x: auto; }
  th, td { padding: .45rem .6rem; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; }
  .badge {
    display: inline-block; padding: .18rem .55rem; border-radius: 999px;
    font-size: .76rem; font-weight: 600;
  }
  .high { background: #2f6f5f22; color: var(--accent); }
  .medium { background: #9a6b1f22; color: var(--warn); }
  .low { background: #a8352c22; color: var(--danger); }
  .violation { color: var(--danger); font-family: var(--mono); font-size: .85rem; }
  .note { color: var(--warn); font-size: .85rem; }
  .meta { color: var(--muted); font-size: .8rem; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: .5rem; }
  .bar > div { height: 100%; background: var(--accent); }
  .hidden { display: none; }
  /* The mock provider returns canned SQL from a fixture table. Without a visible marker
     its output is indistinguishable from a real model's, which is genuinely misleading —
     it is the exact confusion that prompted adding this. */
  .banner {
    margin-top: .9rem; padding: .6rem .8rem; border-radius: 8px; font-size: .85rem;
    border: 1px solid var(--warn); color: var(--warn); background: #9a6b1f14;
  }
  .banner.live { border-color: var(--accent); color: var(--accent); background: #2f6f5f14; }
  /* The answer, as one line in the question's language (built from the result, present.py). */
  .answer { font-size: 1.3rem; font-weight: 600; line-height: 1.45; unicode-bidi: plaintext; }
  /* Suggestions under the question box. */
  .field { position: relative; flex: 1; display: flex; }
  .field input[type=text] { width: 100%; }
  .suggest {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 10;
    margin: 0; padding: .3rem 0; list-style: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px #0002;
    max-height: 22rem; overflow-y: auto;
  }
  .suggest li {
    padding: .45rem .8rem; cursor: pointer; display: flex; gap: .6rem;
    justify-content: space-between; align-items: baseline; unicode-bidi: plaintext;
  }
  .suggest li[aria-selected="true"], .suggest li:hover { background: var(--code-bg); }
  .suggest .tag { color: var(--accent); font-size: .72rem; white-space: nowrap; }
  /* Small secondary buttons: CSV, copy. */
  .actions { display: flex; gap: .4rem; margin: -.2rem 0 .6rem; }
  .actions button {
    background: transparent; color: var(--accent); border: 1px solid var(--line);
    padding: .25rem .65rem; font-size: .78rem; border-radius: 6px;
  }
  /* Charts are inline SVG: the page's CSP allows no external scripts, and none are needed. */
  svg.chart { width: 100%; height: auto; display: block; }
  svg.chart .bar-fill { fill: var(--accent); opacity: .85; }
  svg.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
  svg.chart .dot { fill: var(--accent); }
  svg.chart .axis { stroke: var(--line); }
  svg.chart text { fill: var(--ink); font: 12px system-ui, sans-serif; }
  svg.chart text.muted { fill: var(--muted); font-size: 11px; }
  .how { color: var(--muted); font-size: .88rem; margin-top: .45rem; unicode-bidi: plaintext; }
  .feedback { display: flex; gap: .4rem; align-items: center; margin-top: .7rem;
    font-size: .82rem; color: var(--muted); }
  .feedback button { background: transparent; border: 1px solid var(--line);
    padding: .15rem .55rem; font-size: .95rem; border-radius: 6px; }
  .flag { display: inline-block; margin-top: .6rem; font-size: .8rem; font-weight: 600; }
  .flag.ok { color: var(--accent); }
  .flag.bad { color: var(--danger); }
  details.tech > summary { cursor: pointer; color: var(--muted); font-size: .85rem;
    margin: .2rem 0 .9rem; }
  .help-link { background: none; border: 0; padding: 0; color: var(--accent);
    font-size: .85rem; cursor: pointer; text-decoration: underline; margin: -.4rem 0 1rem; }
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: .6rem; }
  .topics > div { border: 1px solid var(--line); border-radius: 8px; padding: .55rem .7rem;
    font-size: .85rem; }
  .topics b { display: block; }
  .topics .alias { color: var(--muted); unicode-bidi: plaintext; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Text-to-SQL <span>Guardrails</span></h1>
    <p class="sub">Ask in English, Arabic or Urdu. Every query is validated against the
      real schema before it is allowed to run.</p>
    <div id="banner" class="banner hidden"></div>
  </header>

  <form id="form">
    <div class="field">
      <input id="q" type="text" dir="auto" placeholder="Ask in English, Arabic or Urdu…"
        autocomplete="off" autofocus role="combobox" aria-autocomplete="list"
        aria-controls="suggest" aria-expanded="false">
      <ul id="suggest" class="suggest hidden" role="listbox"></ul>
    </div>
    <button id="go" type="submit">Ask</button>
  </form>

  <div class="examples" id="examples"></div>
  <button type="button" class="help-link" id="help-link">What can I ask?</button>
  <div class="card hidden" id="help"></div>

  <div id="out"></div>
</div>

<script>
const EXAMPLES = [
  "how many orders were delivered late?",
  "which courier delivered late most often?",
  "كم عدد الطلبات المتأخرة في دبي؟",
  "ما متوسط قيمة الطلب لكل مدينة؟",
  "کتنے آرڈر ابھی تک ڈیلیور نہیں ہوئے؟",
  "drop the orders table",
];

const LANGUAGE = {en: "English", ar: "Arabic", ur: "Urdu", mixed: "Arabic + English"};

const out = document.getElementById("out");
const qEl = document.getElementById("q");
const goEl = document.getElementById("go");

// Announce which backend is serving, and whether it is ready. On the mock provider the SQL
// comes from a fixture table, not from a model, and saying so up front is the difference
// between a demo and a magic trick. On a live model the server reads its prompt once at
// startup (minutes on a CPU); saying "warming up" beats a counter that looks like a hang.
const banner = document.getElementById("banner");
function showHealth(h) {
  banner.classList.remove("hidden");
  if (h.provider === "mock") {
    banner.textContent = "Mock backend — SQL comes from a fixture table, not a model. "
      + "The guardrails, schema validation and execution are real. "
      + "Run with MIZAN_PROVIDER=ollama for genuine generation.";
    return;
  }
  const cached = h.cached_answers ? ` ${Number(h.cached_answers)} answers cached.` : "";
  if (h.warmup === "failed") {
    banner.classList.remove("live");
    banner.textContent = `${h.provider}/${h.model} did not respond to the warm-up. `
      + "Check that the model server is running (mizan health); questions will fail until it is.";
  } else if (h.warming_up) {
    banner.classList.remove("live");
    banner.textContent = `Warming up ${h.provider}/${h.model}: the model is reading its `
      + "prompt, once, after a cold start (a few minutes on a CPU). "
      + "A question asked now waits for it.";
    setTimeout(checkHealth, 5000);
  } else {
    banner.classList.add("live");
    banner.textContent = `Ready: ${h.provider}/${h.model}. New questions take seconds; `
      + `repeated ones come from the cache in milliseconds.${cached}`;
  }
}
function checkHealth() {
  fetch("/api/health").then(r => r.json()).then(showHealth).catch(() => {});
}
checkHealth();

const examplesEl = document.getElementById("examples");
for (const ex of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = ex;
  b.onclick = () => { qEl.value = ex; document.getElementById("form").requestSubmit(); };
  examplesEl.appendChild(b);
}

const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------------------------------------------------------------- suggestions as you type
// The list comes from /api/suggest: curated questions only (never other users' questions),
// cached ones first and marked "instant", because picking one answers in milliseconds.
const suggestEl = document.getElementById("suggest");
let suggestions = [], picked = -1, suggestSeq = 0, suggestTimer = null;

function closeSuggestions() {
  suggestEl.classList.add("hidden");
  qEl.setAttribute("aria-expanded", "false");
  suggestions = []; picked = -1;
}
function drawSuggestions() {
  if (!suggestions.length) { closeSuggestions(); return; }
  suggestEl.innerHTML = suggestions.map((s, i) =>
    `<li role="option" id="sg-${i}" aria-selected="${i === picked}" data-i="${i}">`
    + `<span>${esc(s.question)}</span>`
    + (s.verified ? `<span class="tag">✓ verified</span>`
      : s.instant ? `<span class="tag">⚡ instant</span>` : "") + `</li>`).join("");
  suggestEl.classList.remove("hidden");
  qEl.setAttribute("aria-expanded", "true");
}
function choose(i) {
  qEl.value = suggestions[i].question;
  closeSuggestions();
  document.getElementById("form").requestSubmit();
}
qEl.addEventListener("input", () => {
  clearTimeout(suggestTimer);
  const text = qEl.value.trim();
  if (text.length < 2) { closeSuggestions(); return; }
  suggestTimer = setTimeout(async () => {
    const seq = ++suggestSeq;  // answers can arrive out of order; only the latest counts
    try {
      const r = await fetch(`/api/suggest?q=${encodeURIComponent(text)}&limit=8`);
      const body = await r.json();
      if (seq !== suggestSeq) return;
      suggestions = body.suggestions || []; picked = -1;
      drawSuggestions();
    } catch { closeSuggestions(); }
  }, 120);
});
qEl.addEventListener("keydown", (e) => {
  if (suggestEl.classList.contains("hidden")) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const step = e.key === "ArrowDown" ? 1 : -1;
    picked = (picked + step + suggestions.length) % suggestions.length;
    drawSuggestions();
  } else if (e.key === "Enter" && picked >= 0) {
    e.preventDefault(); choose(picked);
  } else if (e.key === "Escape") {
    closeSuggestions();
  }
});
// mousedown, not click: it fires before the input's blur closes the list.
suggestEl.addEventListener("mousedown", (e) => {
  const li = e.target.closest("li");
  if (li) { e.preventDefault(); choose(Number(li.dataset.i)); }
});
qEl.addEventListener("blur", () => setTimeout(closeSuggestions, 100));

// -------------------------------------------------------------------- CSV and clipboard
// Excel needs the byte-order mark to read Arabic and Urdu as UTF-8. A cell that starts
// with = + - @ (or a tab/return) is prefixed with ' so a spreadsheet shows it as text
// instead of running it as a formula: database values (customer names) are user input.
function csvCell(v) {
  if (v === null || v === undefined) return "";
  let text = String(v);
  if (typeof v === "string" && /^[=+\-@\t\r]/.test(text)) text = "'" + text;
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}
function downloadCSV(result) {
  const lines = [result.columns, ...result.rows].map(r => r.map(csvCell).join(","));
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `answer-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function copyAnswer(d, button) {
  const table = [d.result.columns, ...d.result.rows]
    .map(r => r.map(v => v === null ? "" : String(v)).join("\t")).join("\n");
  try {
    await navigator.clipboard.writeText((d.summary ? d.summary + "\n\n" : "") + table);
    button.textContent = "Copied";
  } catch { button.textContent = "Copy failed"; }
  setTimeout(() => { button.textContent = "Copy"; }, 1500);
}

// ------------------------------------------------------------------------ what can I ask
// Tableau retired Ask Data partly because people had to know the field names to use it.
// This lists what the database holds, with the Arabic and Urdu words the glossary knows.
const helpEl = document.getElementById("help");
document.getElementById("help-link").onclick = async () => {
  if (!helpEl.classList.contains("hidden")) { helpEl.classList.add("hidden"); return; }
  try {
    const schema = await fetch("/api/schema").then(r => r.json());
    const cards = Object.entries(schema.tables).map(([name, t]) =>
      // First sentence only: the glossary's descriptions are written for the model and
      // carry column names after that ("unit_price_aed here is ...").
      `<div><b>${esc(name.replace(/_/g, " "))}</b> ${esc((t.description || "").split(". ")[0])}`
      + ` <span class="meta">· ${Number(t.row_count).toLocaleString("en")} rows</span>`
      + `<div class="alias" dir="auto">${esc([...t.aliases_ar.slice(0, 2), ...t.aliases_ur.slice(0, 2)].join(" · "))}</div></div>`);
    helpEl.innerHTML = `<h2>What you can ask about</h2><div class="topics">${cards.join("")}</div>`
      + `<p class="meta" style="margin:.7rem 0 0">Start typing for suggestions. Questions can be in `
      + `English, Arabic or Urdu; names and places can be written either way.</p>`;
    helpEl.classList.remove("hidden");
  } catch { /* the panel is optional */ }
};

// ------------------------------------------------------------------------------ feedback
// 👍 marks the answer verified (and suggestions show it first); 👎 stops it being served
// from the cache and warns the next person. The page sends only the answer's id: the
// server never accepts SQL from the browser.
async function sendFeedback(d, verdict, box) {
  box.textContent = "…";
  try {
    const r = await fetch("/api/feedback", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer_id: d.answer_id, verdict }),
    });
    box.textContent = !r.ok ? "Couldn't save that, try asking again."
      : verdict === "up" ? "Thanks: marked as a verified answer."
      : "Thanks: reported. It won't be served from the cache again.";
  } catch { box.textContent = "Couldn't save that."; }
}

// The phone's share sheet (WhatsApp included) where the browser has one.
async function shareAnswer(d) {
  const text = `${d.question}\n${d.summary || ""}`.trim();
  try { await navigator.share({ text }); } catch { /* cancelled */ }
}

// ------------------------------------------------------------------------------- charts
// The server picks the chart (present.chart_spec, tested in Python); the page only draws.
function chartSVG(result, spec) {
  const pairs = result.rows.map(r => [r[spec.label], r[spec.value]])
    .filter(p => typeof p[1] === "number");
  if (pairs.length < 2 || pairs.some(p => p[1] < 0)) return "";
  const max = Math.max(...pairs.map(p => p[1])) || 1;
  const fmt = (v) => Number(v).toLocaleString("en", { maximumFractionDigits: 2 });
  const short = (t) => { const s = String(t); return s.length > 24 ? s.slice(0, 23) + "…" : s; };
  const title = `${esc(result.columns[spec.value])} by ${esc(result.columns[spec.label])}`;
  if (spec.type === "bar") {
    const row = 26, labelW = 190, barW = 380, h = pairs.length * row + 8;
    const bars = pairs.map(([label, v], i) => {
      const y = 4 + i * row, w = Math.max(2, (v / max) * barW);
      return `<text x="${labelW - 8}" y="${y + 16}" text-anchor="end">`
        + `<title>${esc(label)}</title>${esc(short(label))}</text>`
        + `<rect class="bar-fill" x="${labelW}" y="${y + 4}" width="${w}" height="${row - 9}" rx="3"/>`
        + `<text class="muted" x="${labelW + w + 6}" y="${y + 16}">${esc(fmt(v))}</text>`;
    }).join("");
    return `<svg class="chart" viewBox="0 0 660 ${h}" role="img" aria-label="${title}">${bars}</svg>`;
  }
  const W = 660, H = 230, left = 56, right = 16, top = 14, bottom = 34;
  const x = (i) => left + (i * (W - left - right)) / (pairs.length - 1);
  const y = (v) => top + (1 - v / max) * (H - top - bottom);
  const points = pairs.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const every = Math.ceil(pairs.length / 8);
  const xLabels = pairs.map((p, i) => i % every ? "" :
    `<text class="muted" x="${x(i)}" y="${H - 12}" text-anchor="middle">${esc(short(p[0]))}</text>`).join("");
  const dots = pairs.map((p, i) => `<circle class="dot" cx="${x(i)}" cy="${y(p[1])}" r="3">`
    + `<title>${esc(p[0])}: ${esc(fmt(p[1]))}</title></circle>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">`
    + `<line class="axis" x1="${left}" y1="${y(0)}" x2="${W - right}" y2="${y(0)}"/>`
    + `<text class="muted" x="${left - 8}" y="${y(max) + 4}" text-anchor="end">${esc(fmt(max))}</text>`
    + `<text class="muted" x="${left - 8}" y="${y(0) + 4}" text-anchor="end">0</text>`
    + `<polyline class="line" points="${points}"/>${dots}${xLabels}</svg>`;
}

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  closeSuggestions();
  const question = qEl.value.trim();
  if (!question) return;

  goEl.disabled = true;

  // A static "Generating…" is indistinguishable from a hang. A question usually takes
  // seconds, but one asked during the startup warm-up waits for it (about 3 minutes on a
  // CPU), and one queued behind an eval run waits longer, because Ollama serialises
  // requests per model. Showing elapsed time is the difference between "working" and
  // "broken" from the user's side.
  const started = Date.now();
  let tick = null;
  const paint = () => {
    const s = Math.round((Date.now() - started) / 1000);
    let note = "";
    if (s > 240) {
      note = "<br>Much slower than usual — another process may be queued at the same "
           + "model. Check with: <code>pgrep -fa 'mizan eval'</code>";
    } else if (s > 30) {
      note = "<br>The model is probably still reading its prompt (a one-off warm-up of "
           + "about 3 minutes after the server starts). This is normal.";
    }
    out.innerHTML = `<div class="card meta">Generating… <strong>${s}s</strong>${note}</div>`;
  };
  paint();
  tick = setInterval(paint, 1000);

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    if (!res.ok) {
      const detail = await res.text();
      out.innerHTML = `<div class="card"><h2>Service error</h2>
        <div class="violation">HTTP ${res.status}</div><pre>${esc(detail)}</pre></div>`;
      return;
    }
    render(await res.json());
    checkHealth();  // the cached-answer count may have changed
  } catch (err) {
    out.innerHTML = `<div class="card"><h2>Network error</h2>
      <div class="violation">${esc(err.message)}</div></div>`;
  } finally {
    if (tick) clearInterval(tick);
    goEl.disabled = false;
  }
};

function render(d) {
  let html = "";

  html += `<div class="card"><h2>Question · ${esc(LANGUAGE[d.script] || d.script)}</h2>
    <div${d.rtl ? ' class="rtl"' : ""}>${esc(d.question)}</div></div>`;

  if (d.violations && d.violations.length) {
    html += `<div class="card"><h2>Blocked by guardrails</h2>`;
    for (const v of d.violations) {
      html += `<div class="violation">${esc(v.rule)} — ${esc(v.detail)}</div>`;
    }
    html += `<p class="meta" style="margin-bottom:0">The query was rejected before touching
      the database. Nothing was executed.</p></div>`;
  }

  // The answer first, for someone who doesn't read SQL; how it was produced comes after.
  if (d.summary) {
    html += `<div class="card"><h2>Answer</h2>
      <div class="answer" dir="auto">${esc(d.summary)}</div>`;
    if (d.explanation) {
      // The query in plain steps, so someone who doesn't read SQL can check what was counted.
      html += `<div class="how" dir="auto">How: ${esc(d.explanation)}</div>`;
    }
    if (d.cache && d.cache.verified) {
      html += `<span class="flag ok">✓ Verified: a person confirmed this answer.</span>`;
    }
    if (d.reported) {
      html += `<span class="flag bad">⚠ Someone reported this answer as wrong. Check the steps above.</span>`;
    }
    if (d.answer_id) {
      html += `<div class="feedback" id="feedback">Right answer?
        <button type="button" id="up" title="Yes, this is right">👍</button>
        <button type="button" id="down" title="No, this is wrong">👎</button></div>`;
    }
    html += `</div>`;
  }

  if (d.result && d.chart) {
    const svg = chartSVG(d.result, d.chart);
    if (svg) html += `<div class="card"><h2>Chart</h2>${svg}</div>`;
  }

  if (d.result) {
    const cols = d.result.columns, rows = d.result.rows;
    html += `<div class="card"><h2>Result · ${rows.length} rows</h2>
      <div class="actions"><button type="button" id="csv">Download CSV</button>
      <button type="button" id="copy">Copy</button>
      ${navigator.share ? '<button type="button" id="share">Share</button>' : ""}</div>
      <div class="scroll"><table><thead><tr>`;
    for (const c of cols) html += `<th>${esc(c)}</th>`;
    html += `</tr></thead><tbody>`;
    for (const r of rows.slice(0, 50)) {
      html += "<tr>" + r.map(v => `<td dir="auto">${esc(v === null ? "∅" : v)}</td>`).join("") + "</tr>";
    }
    html += `</tbody></table></div>`;
    if (rows.length > 50) {
      html += `<p class="meta" style="margin-bottom:0">Showing 50 of ${rows.length} rows; the CSV has all of them.</p>`;
    }
    if (d.result.truncated) html += `<p class="note" style="margin-bottom:0">Truncated.</p>`;
    html += `</div>`;
  }

  // The evidence, one click away: open by default only when there is no answer to show.
  html += `<details class="tech"${d.summary ? "" : " open"}><summary>Details: the SQL, `
    + `the checks it passed and the confidence</summary>`;
  if (d.sql) {
    html += `<div class="card"><h2>Generated SQL</h2><pre>${esc(d.sql)}</pre></div>`;
  }

  if (d.warnings && d.warnings.length) {
    html += `<div class="card"><h2>Notes</h2>`;
    for (const w of d.warnings) html += `<div class="note">${esc(w)}</div>`;
    html += `</div>`;
  }

  if (d.error && !(d.violations || []).length) {
    html += `<div class="card"><h2>Error</h2><div class="violation">${esc(d.error)}</div></div>`;
  }

  const c = d.confidence || {};
  // `band` is interpolated into a class attribute, not into text, so esc() is the wrong
  // tool — attribute context needs an allowlist, not entity encoding. The value is
  // server-controlled today; pinning it to the three known bands means a future change
  // that makes it data-derived cannot turn into attribute injection.
  const BANDS = ["high", "medium", "low"];
  const band = BANDS.includes(c.band) ? c.band : "low";
  const pct = Math.round((c.score || 0) * 100);
  html += `<div class="card"><h2>Confidence</h2>
    <span class="badge ${band}">${pct}% · ${esc(band)}</span>
    <div class="bar"><div style="width:${pct}%"></div></div>`;
  for (const s of (c.signals || [])) {
    html += `<div class="meta" style="margin-top:.4rem">
      <strong>${esc(s.name)}</strong> ${Math.round(s.value * 100)}% — ${esc(s.detail)}</div>`;
  }
  html += `<p class="meta" style="margin:.7rem 0 0">A heuristic ranking signal, not a
    calibrated probability.</p></div>`;

  const repaired = d.repairs ? ` · repaired ${Number(d.repairs)}×` : "";
  const cached = d.cache && d.cache.hit
    ? ` · <strong>from cache</strong> (same question as “${esc(d.cache.matched)}”; `
      + `SQL validated and run again)`
    : "";
  html += `<p class="meta">${esc(d.provider)}/${esc(d.model)} · ${d.latency_ms} ms`
    + `${repaired}${cached}</p></details>`;
  out.innerHTML = html;
  if (d.answer_id) {
    const box = document.getElementById("feedback");
    document.getElementById("up").onclick = () => sendFeedback(d, "up", box);
    document.getElementById("down").onclick = () => sendFeedback(d, "down", box);
  }
  const share = document.getElementById("share");
  if (share) share.onclick = () => shareAnswer(d);
  if (d.result) {
    document.getElementById("csv").onclick = () => downloadCSV(d.result);
    const copy = document.getElementById("copy");
    copy.onclick = () => copyAnswer(d, copy);
  }
}
</script>
</body>
</html>
